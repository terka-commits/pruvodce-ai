<title>Průvodce AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: rozcestník. Bílý základ, klidná petrolejová jako barva akce, směrovky v barvě písku a dřeva, zelená = hotovo.
   Nahoře přepínač pohledu, pro vedení záložky s podtržením; jeden sloupec do 1040px. */
:root{
  --bg:#FFFFFF;--paper:#F5F7F7;--ink:#14232B;--mute:#5C6B72;--line:#DCE4E6;
  --blue:#0B6E8E;--blue-ink:#FFFFFF;--blue-soft:#E4F1F5;
  --red:#B8563F;--green:#2E7D57;--green-soft:#E2F1E8;--yellow:#D99A2B;--yellow-soft:#FBF3E2;
  --warn:#B85A1E;--warn-soft:#F8EADF;--plate:#FFFFFF;--plate-ink:#14232B;--wood:#9C7650;--hill:#E6EFE9;--sign:#F4EBD8;
  --c1:#0B6E8E;--c2:#D99A2B;--c3:#3F8061;--c4:#B8563F;--c5:#94A3AA;--c6:#5E6E9E;
  --f-d:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F181C;--paper:#162228;--ink:#E5EDF0;--mute:#93A6AE;--line:#26383F;
  --blue:#4DB6D6;--blue-ink:#062029;--blue-soft:#15313B;
  --red:#E07A62;--green:#5CC48D;--green-soft:#143022;--yellow:#E9B652;--yellow-soft:#2E2717;
  --warn:#EE9B5E;--warn-soft:#38251A;--plate:#162228;--plate-ink:#E5EDF0;--wood:#7E6143;--hill:#16271E;--sign:#33301F;
  --c1:#4DB6D6;--c2:#E9B652;--c3:#5CC48D;--c4:#E07A62;--c5:#7C8E96;--c6:#93A4D6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-b);
  padding-block:0 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);line-height:1.12;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h1{font-size:36px}h2{font-size:25px;margin-bottom:6px}h3{font-size:18px;font-weight:600;margin-bottom:6px}
p{margin:0 0 10px}
a{color:var(--blue)}
.mute{color:var(--mute)}.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.eyebrow{font:600 12px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
/* hlavička */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:14px 24px;align-items:center;padding-block:18px 16px}
.mid{display:flex;flex-direction:column;gap:3px;align-items:center;justify-self:center}
#demolbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.top .right{flex-wrap:nowrap}
.top .right{justify-self:end}
@media (max-width:1240px){.top{grid-template-columns:1fr auto}.mid{grid-column:1/-1;grid-row:2;justify-self:start;align-items:flex-start}}
@media (max-width:640px){.top{grid-template-columns:1fr}.top .right{justify-self:start;flex-wrap:wrap}}
.brand{display:flex;gap:12px;align-items:center}
.brand b{display:block;font:700 24px/1 var(--f-d);letter-spacing:-.01em}
.brand small{display:block;font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .right>*+.userchip{margin-left:6px;padding-left:16px;border-left:1px solid var(--line)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{background:none;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,35,43,.12)}
.theme{background:none;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:36px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500;font-size:15px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--blue)}
.rolebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
.demo-bar{background:var(--yellow-soft);border:1px solid color-mix(in srgb,var(--yellow) 45%,transparent);border-radius:8px;padding:8px 14px;font-size:14px;margin-bottom:16px}
/* znak, dlaždice úseků */
.masc{flex:none;display:block}
.stile{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.stile svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stile.done{background:var(--green-soft);color:var(--green)}
/* karty, formuláře */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;min-width:0}
.card.white{background:var(--bg)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid>.card,.grid3>.card{margin-bottom:0}
.stack{display:grid;gap:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
textarea{min-height:96px;resize:vertical}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:color-mix(in srgb,var(--blue) 88%,var(--ink))}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--mute)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.note{background:var(--blue-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 8px;background:var(--paper);border:1px solid var(--line);color:var(--mute)}
.pill.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.pill.try{background:var(--yellow-soft);border-color:var(--yellow);color:var(--ink)}
.pill.no{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pill.demo{background:var(--yellow-soft);border-color:var(--yellow);color:var(--ink)}
/* průvodce */
.guide{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.gb{background:var(--blue-soft);border-radius:2px 12px 12px 12px;padding:12px 16px;min-width:0}
.gb .eyebrow{color:var(--blue);margin-bottom:2px}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(100px + env(safe-area-inset-bottom,0px));max-width:min(460px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px 10px 10px;font-size:15px;opacity:0;pointer-events:none;z-index:20;display:flex;gap:10px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .25s,transform .25s}.track i,.prog i{transition:width .6s}}
/* další krok */
.next{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--blue-soft);border-radius:16px;padding:24px 26px;margin-bottom:18px}
.next h2{font-size:28px}
.next p{max-width:60ch}
/* trasa */
.trail-scroll{overflow-x:auto;padding:6px 0}
.trail{display:grid;grid-template-columns:repeat(8,minmax(88px,1fr));min-width:720px;list-style:none;padding:0;margin:0}
.stop{position:relative;text-align:center}
.stop::before{content:"";position:absolute;top:22px;left:-50%;right:50%;height:2px;background:var(--line)}
.stop:first-child::before{display:none}
.stop.done::before,.stop.cur::before{background:var(--green)}
.stop button{position:relative;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:0 2px}
.mk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);color:var(--mute)}
.done .mk{background:var(--green);border-color:var(--green);color:#fff}
.mk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cur .mk{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);padding:0}
.stop button:hover .mk{border-color:var(--blue)}
.lb{font-weight:600;font-size:14px;color:var(--ink);line-height:1.15}
.st{font-size:12px;color:var(--mute);min-height:16px}
.cur .st{color:var(--blue);font-weight:600}
/* rozcestník */
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:center}
.signpost{width:100%;height:auto;display:block}
@media (max-width:780px){.hero{grid-template-columns:1fr}.signpost{max-width:380px;margin:0 auto}}
/* týmy */
.teams{display:grid;gap:8px}
.team{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.team.on{border-color:var(--blue);background:var(--blue-soft)}
.team button.tg{background:none;border:0;text-align:left;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;min-width:0}
.dot{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--bg)}
.on .dot{background:var(--blue);border-color:var(--blue)}
.on .dot::after{content:"";width:6px;height:10px;border:solid var(--blue-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bubbles{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px 0}
.bub{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;border:1px solid var(--line);font-size:12px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto;overflow:hidden;background:var(--blue-soft)}
.bub b{font:700 26px var(--f-d)}
.bub.hid{background:var(--bg);color:var(--mute);border-style:dashed}
/* KPI, nápověda */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .v{font:700 46px/1 var(--f-d);font-variant-numeric:tabular-nums}
.kpi .l{font-size:14px;color:var(--mute);margin-top:6px}
.kpi .band{font-size:13px;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.kpi.w .v,.kpi.w .band{color:var(--warn)}.kpi.g .v,.kpi.g .band{color:var(--blue)}.kpi.ok .v,.kpi.ok .band{color:var(--green)}
.mini .kpi{padding:12px}.mini .kpi .v{font-size:34px}
.delta{font-size:14px;font-weight:700;margin-top:6px}.delta.up{color:var(--green)}.delta.dn{color:var(--warn)}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font:700 12px/1 var(--f-b);cursor:help;vertical-align:middle;margin-left:6px}
.tip::after{content:attr(data-tip);position:absolute;left:-8px;top:26px;width:max-content;max-width:min(280px,72vw);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 12px;font:400 13px/1.45 var(--f-b);text-align:left;text-transform:none;letter-spacing:0;opacity:0;pointer-events:none;z-index:15}
.tip.r::after{left:auto;right:-8px}
.tip:hover::after,.tip:focus::after{opacity:1}
/* grafy */
.bar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 50px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.track{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;position:relative}
.track i{display:block;height:100%;background:var(--blue);border-radius:5px}
.track i.w{background:var(--warn)}.track i.ok{background:var(--green)}.track i.m{background:var(--c5);opacity:.6;height:6px}
.track.two{height:24px;display:grid;gap:3px;align-content:center;padding:2px 0}
.track.two i{height:7px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.chart{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.chart text{font:13px var(--f-b);fill:var(--ink)}
.chart .gl{fill:none;stroke:var(--line)}
.legend{display:grid;gap:4px;font-size:14px;margin-top:8px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 13px var(--f-d);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.rec{border-left:4px solid var(--blue);padding:4px 0 4px 14px;margin:12px 0}
.rec b{display:block}
.quote{border-left:3px solid var(--line);padding-left:12px;margin:8px 0;font-style:italic;color:var(--mute)}
details{margin-top:4px}summary{cursor:pointer;font-weight:600}
details.qa{border-bottom:1px solid var(--line);padding:10px 0}
details.qa p{margin:8px 0 0}
/* trasa: etapy */
.stage-h{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.stage-h h2{margin:0}
.meta{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:10px 0 14px;font-size:15px}
.meta div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.meta .eyebrow{display:block;margin-bottom:2px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.task input{margin-top:4px;width:19px;height:19px;accent-color:var(--green);flex:none}
.task small{color:var(--mute)}
.prog{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.ai-out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;font-size:15px}
.ai-tag{font:700 12px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.amb-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;margin:6px 0}
/* milníky */
.mile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:0}
.mile b{display:block}
.mile.wait b{color:var(--mute);font-weight:600}
.ai-note{display:inline-block;font:600 11px/1.3 var(--f-b);letter-spacing:.02em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mute);background:var(--bg);white-space:nowrap}
/* plán */
.tl{position:relative;margin:8px 0 0 12px;padding-left:30px;border-left:4px dotted var(--line)}
.tli{position:relative;padding:0 0 22px;display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px 16px;align-items:center}
.tli::before{content:"";position:absolute;left:-45px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:4px solid var(--blue)}
.tli.done::before{background:var(--green);border-color:var(--green)}
.tli small{display:block;color:var(--mute)}
/* use casy, otázky */
.uc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.uc h3{margin:0}
.uc .hrs{font:700 22px var(--f-d)}
.qcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.qcard .q{font-weight:600;margin-bottom:6px}
.qcard .a{border-left:3px solid var(--green);padding-left:10px;margin-top:6px}
/* dotazník */
.qq{margin-bottom:22px}
.qq>b{display:block;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;background:var(--bg)}
.opts label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.opts input{accent-color:var(--blue)}
.other{display:none;margin-top:8px;max-width:420px}
.qq:has(input[data-other]:checked) .other{display:block}
.scale{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.scale .opts{flex-wrap:nowrap}
.scale .opts label{padding:6px 11px}
.err{color:var(--warn);font-weight:700}
.promise{font:600 22px/1.35 var(--f-d);letter-spacing:-.01em;background:var(--blue-soft);border-radius:2px 14px 14px 14px;padding:16px 20px;margin:8px 0 6px;max-width:62ch}
/* úvod, rozcestník, obrazovky */
.intro,.slide{min-width:0}
.slide{max-width:760px}.slide.wide{max-width:none}
.slide>h1,.intro>h1{margin:6px 0 10px}
.lead{font-size:18px;line-height:1.5;color:var(--mute);max-width:60ch;margin-bottom:22px}
.btn.lg{padding:13px 26px;font-size:17px}
.chlist{list-style:none;padding:0;margin:26px 0 28px;display:grid;gap:22px}
.chlist li{display:flex;gap:16px;align-items:flex-start;line-height:1.45}
.chlist b{display:block;font:700 19px var(--f-d);margin-bottom:3px}
.cn{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;flex:none}
.intro>h1{font-size:40px;max-width:16ch}
.together{background:var(--paper);border-radius:12px;padding:16px 18px;max-width:60ch;margin:0}
.cont{background:var(--blue-soft);border-radius:14px;padding:18px 20px;display:grid;gap:2px;justify-items:start}
.cont b{font:700 22px var(--f-d)}.cont .btn{margin-top:12px}
.card.advice{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 25%,transparent)}
.card.advice .rec{border-left-color:var(--blue);background:var(--bg);border-radius:0 10px 10px 0;padding:12px 16px}
/* přednáška */
.deck{display:flex;justify-content:center}
.dk-slide{width:100%;max-width:960px;aspect-ratio:16/9;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 10%,transparent);padding:clamp(22px,5vw,56px);display:flex;flex-direction:column;gap:14px;overflow:auto}
.dk-t{font-size:clamp(26px,4vw,44px);margin:0}
.dk-b{flex:1;font-size:clamp(15px,1.7vw,20px);min-height:0}
.dk-b .bar{font-size:inherit}
.dk-lead{color:var(--mute);font-size:inherit;max-width:52ch}
.dk-quote{margin:0;font:600 clamp(18px,2.4vw,28px)/1.35 var(--f-d);border-left:5px solid var(--blue);padding-left:18px;max-width:40ch}
.dk-quote.sm{font-size:clamp(16px,1.9vw,22px);font-weight:500;margin-bottom:14px}

function recs(st,rows){
  var out=[],tf=top(st.fears,1)[0],f=FEARS.filter(function(x){return x.k===tf})[0];
  if(st.adopt<25&&st.fear>=50)out.push(['Začněte důvěrou, ne nástroji','AI používá týdně jen '+st.adopt+' % lidí a obavy jsou vysoké (index '+st.fear+'). Další nástroj teď nepomůže. Nejdřív odehrajte úvodní přednášku a řekněte nahlas, co AI pro firmu znamená.']);
  else if(st.adopt<25)out.push(['Obavy nejsou vysoké, ale používání je nízké','Lidé AI nepoužívají, i když se jí tolik nebojí. Překážkou bude spíš čas a návod. Zaměřte se na příklady z jejich práce.']);
  out.push(['Největší obava: '+f.t.toLowerCase(),'Hodnota '+st.fears[tf]+' ze 100. Odpovězte na ni výslovně v přednášce.']);
  if(st.usersN&&st.own>=40)out.push(['Stínová AI',st.own+' % těch, kdo AI používají, ji používá na vlastní účet nebo ve free verzi. Dejte jasná pravidla pro data, ať lidé nemusí tajit, co dělají.']);
  var v=rows.filter(function(r){return r.vis&&r.t.id!=='other'}).sort(function(a,b){return b.st.fear-a.st.fear})[0];
  if(v)out.push(['Začněte u týmu '+v.t.name,'Má nejvyšší index obav ('+v.st.fear+'). Tady dává smysl vybrat ambasadora jako první.']);
  var h=top(st.help,1)[0];if(h)out.push(['Co lidé nejčastěji chtějí',h+' ('+pct(st.help[h],st.n)+' % odpovídajících). Zařaďte to do dalšího kroku.']);
  return out;
}

async function runAI(kind,extra){
  if(busy)return;busy=kind;err='';S.ai[kind]='';render();
  try{
    if(!sampleFn)throw {code:'unavailable'};
    var prompt=PROMPTS[kind]+'\n\nPiš česky, vykej, buď stručný, žádné vymyšlené údaje.\n\nKontext: '+ctx()+(extra?'\n\n'+extra:'');
    var r=await sampleFn(prompt,{onText:function(t){S.ai[kind]=t.text;var el=$('[data-ai="'+kind+'"]');if(el)el.textContent=t.text}});
    S.ai[kind]=r.text;S.ai[kind+'_src']='ai';
  }catch(e){
    S.ai[kind]=fallback(kind);S.ai[kind+'_src']='tpl';
    err=(e&&e.code==='not_granted')?'AI není povolená, zobrazuji šablonu.':'AI teď není dostupná, zobrazuji šablonu.';
  }
  busy='';save();render();
}

function radar(a,b){

function readForm(){
  var f=$('#survey');if(!f)return;
  var g=function(n){var e=f.querySelector('[name="'+n+'"]:checked');return e?e.value:undefined};
  var all=function(n){return Array.prototype.map.call(f.querySelectorAll('[name="'+n+'"]:checked'),function(e){return e.value})};
  var val=function(n){var e=f.elements[n];return e?e.value:''};
  var fear={};FEARS.forEach(function(x){var v=g('fear_'+x.k);if(v)fear[x.k]=+v});
  S.draft={team:g('team'),teamOther:val('teamOther'),freq:g('freq'),tools:all('tools'),toolsOther:val('toolsOther'),paid:g('paid'),uses:all('uses'),usesOther:val('usesOther'),fear:fear,conf:g('conf'),help:all('help'),text:val('text'),cq:S.customQ.map(function(q,i){return val('cq'+i)})};save();
